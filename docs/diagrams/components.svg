<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 710" width="1120" height="710" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" font-style="normal">Infrastructure implements Core's interfaces. Core depends on nothing.</text><text x="24" y="56" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start" font-style="normal">Dependencies point inward: Pipeline → Infrastructure → Core. Swapping a service means replacing one adapter.</text><rect x="20" y="80" width="170" height="590" rx="8" fill="#f6fbf8" stroke="#2f855a" stroke-width="1.4"/><text x="105" y="102" font-size="12.5" font-weight="700" fill="#2f855a" text-anchor="middle" font-style="normal">FeedbackIntel.Pipeline</text><rect x="210" y="80" width="540" height="590" rx="8" fill="#f7f9fc" stroke="#2f6fdb" stroke-width="1.4"/><text x="480" y="102" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" font-style="normal">FeedbackIntel.Core</text><rect x="775" y="80" width="325" height="590" rx="8" fill="#fffcf5" stroke="#b7791f" stroke-width="1.4"/><text x="937" y="102" font-size="12.5" font-weight="700" fill="#b7791f" text-anchor="middle" font-style="normal">FeedbackIntel.Infrastructure</text><rect x="35" y="300" width="140" height="70" rx="8" fill="#eaf7ef" stroke="#2f855a" stroke-width="1.4"/><text x="105.0" y="323.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">Program</text><text x="105.0" y="339.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">builds the host,</text><text x="105.0" y="355.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">registers adapters</text><rect x="230" y="130" width="230" height="70" rx="8" fill="#eaf1fd" stroke="#2f6fdb" stroke-width="1.4"/><text x="345.0" y="153.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">PipelineOrchestrator</text><text x="345.0" y="169.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">runs steps in order,</text><text x="345.0" y="185.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">alerts on failure</text><rect x="230" y="245" width="230" height="120" rx="8" fill="#eaf1fd" stroke="#2f6fdb" stroke-width="1.4"/><text x="345.0" y="277.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">10 pipeline steps</text><text x="345.0" y="293.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">Migrate · Restore · Ingest</text><text x="345.0" y="309.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">Redact · Enrich · Report</text><text x="345.0" y="325.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">Insights · Quality</text><text x="345.0" y="341.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">Publish · SaveHistory</text><rect x="230" y="410" width="230" height="150" rx="8" fill="#eaf1fd" stroke="#2f6fdb" stroke-width="1.4"/><text x="345.0" y="449.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">Core logic</text><text x="345.0" y="465.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">IssueEnricher · InsightWriter</text><text x="345.0" y="481.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">EnrichmentBatcher</text><text x="345.0" y="497.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">EnrichmentResponseParser</text><text x="345.0" y="513.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">AiUsageBudget · ContentHasher</text><text x="345.0" y="529.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">ContractValidator</text><text x="345" y="600" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">Pure C#, unit-tested with fakes</text><rect x="490" y="120" width="240" height="535" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.2" stroke-dasharray="5 4"/><text x="610" y="142" font-size="12.5" font-weight="700" fill="#2f6fdb" text-anchor="middle" font-style="normal">Interfaces</text><rect x="505" y="158" width="210" height="48" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.4"/><text x="610.0" y="186.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">IIssueSource</text><rect x="795" y="158" width="285" height="48" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="1.4"/><text x="937.5" y="178.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">GitHubIssueSource</text><text x="937.5" y="194.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">Octokit</text><line x1="795" y1="182.0" x2="719" y2="182.0" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="505" y="219" width="210" height="48" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.4"/><text x="610.0" y="247.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">IPiiRedactor</text><rect x="795" y="219" width="285" height="48" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="1.4"/><text x="937.5" y="239.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">PresidioRedactor</text><text x="937.5" y="255.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">HTTP to Presidio</text><line x1="795" y1="243.0" x2="719" y2="243.0" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="505" y="280" width="210" height="48"