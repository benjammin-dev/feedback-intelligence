="422.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">ParquetHistoryStore</text><text x="937.5" y="438.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">Parquet.Net</text><line x1="795" y1="426.0" x2="719" y2="426.0" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="505" y="463" width="210" height="48" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.4"/><text x="610.0" y="491.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">IPublisher</text><rect x="795" y="463" width="285" height="48" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="1.4"/><text x="937.5" y="483.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">FilePublisher</text><text x="937.5" y="499.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">Parquet.Net · JSON</text><line x1="795" y1="487.0" x2="719" y2="487.0" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="505" y="524" width="210" height="48" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.4"/><text x="610.0" y="552.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">IAlerter</text><rect x="795" y="524" width="285" height="48" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="1.4"/><text x="937.5" y="544.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" font-style="normal">GitHubIssueAlerter</text><text x="937.5" y="560.0" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">Octokit</text><line x1="795" y1="548.0" x2="719" y2="548.0" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="505" y="585" width="210" height="48" rx="8" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.4"/><text x="610.