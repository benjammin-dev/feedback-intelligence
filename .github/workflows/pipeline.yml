# Daily pipeline: fetch issues, rebuild reporting data, and publish the dashboard (US-15).
name: Pipeline

on:
  schedule:
    # 13:17 UTC is 6:17 a.m. Pacific. Off the hour, because scheduled runs at :00 are often delayed.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run only: start without history (the data branch doesn't exist yet)"
        type: boolean
        default: false

# Least privilege (NFR-SEC-02): read-only by default; only the deploy job can write to Pages.
permissions:
  contents: read

# Never run two pipelines at once, and never cancel one partway through.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    name: Run pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (pinned; see global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"

      # History lives on the data branch (ADR 0005). A missing branch fails the run, unless
      # this is the deliberate first run with the bootstrap option.
      - name: Check out history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: ${{ inputs.bootstrap == true }}
        with:
          ref: data
          path: out/history

      # A new random password every run, hidden from logs. The container only listens on the
      # runner itself and is destroyed with it, so nothing persists (ADR 0004).
      - name: Start SQL Server
        run: |
          password="Fi-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          # The same pinned image as docker-compose.yml, so local runs and CI always match.
          image=$(grep -oE 'mcr\.microsoft\.com/mssql/server:[^[:space:]"]+' docker-compose.yml)
          docker run --detach --name sqlserver \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Express --env "MSSQL_SA_PASSWORD=$password" \
            --publish 127.0.0.1:1433:1433 \
            "$image"
          echo "ConnectionStrings__FeedbackIntel=Server=localhost,1433;Database=FeedbackIntel;User Id=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"

      # The same pinned images as docker-compose.yml, so local runs and CI always match.
      # Started before the build, so the analyzer loads its language model while .NET compiles.
      - name: Start Presidio
        run: |
          analyzer=$(grep -oE 'mcr\.microsoft\.com/presidio-analyzer:[^[:space:]"]+' docker-compose.yml)
          anonymizer=$(grep -oE 'mcr\.microsoft\.com/presidio-anonymizer:[^[:space:]"]+' docker-compose.yml)
          # Gunicorn 25.1 sometimes never boots its worker when its control socket is on.
          docker run --detach --name presidio-analyzer --publish 127.0.0.1:5002:3000 \
            --env GUNICORN_CMD_ARGS=--no-control-socket "$analyzer"
          docker run --detach --name presidio-anonymizer --publish 127.0.0.1:5001:3000 \
            --env GUNICORN_CMD_ARGS=--no-control-socket "$anonymizer"

      # Vulnerability alerts stop CI and pull requests (NFR-SEC-04), but must not stop the daily
      # run: a new advisory for any package would otherwise freeze the dashboard until fixed.
      - name: Build
        run: dotnet build src/FeedbackIntel.Pipeline --configuration Release -p:NuGetAudit=false

      # Short requests, checked every 2 seconds, so a slow start never hangs the check.
      - name: Wait for Presidio
        run: |
          for attempt in $(seq 90); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:5002/health >/dev/null \
              && curl --silent --fail --max-time 5 http://127.0.0.1:5001/health >/dev/null; then
              echo "Presidio ready after about $((attempt * 2)) seconds"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Presidio didn't become ready within 3 minutes."
          exit 1

      - name: Run pipeline
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Operations__Bootstrap: ${{ inputs.bootstrap == true }}
        run: dotnet run --project src/FeedbackIntel.Pipeline --configuration Release --no-build

      - name: Assemble site
        run: cp dashboard/* out/site/

      # Handed to the save-history job, the only one allowed to write to the repository.
      - name: Upload history
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: history
          path: out/history/*.parquet
          if-no-files-found: error
          retention-days: 1

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/site

  deploy:
    name: Deploy to GitHub Pages
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The only job that can write to the repository, and only to the data branch.
  save-history:
    name: Save history to the data branch
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download history
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: history
          path: ${{ runner.temp }}/history

      - name: Commit history to the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git switch data
            git rm -r -q .
          else
            git switch --orphan data
          fi
          cp "$RUNNER_TEMP"/history/*.parquet .
          git add -- *.parquet
          if git diff --cached --quiet; then
            echo "History unchanged"
            exit 0
          fi
          git commit -q -m "data: history from run ${{ github.run_id }}"
          git push origin data
