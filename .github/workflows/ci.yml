# Continuous integration: build, format check, tests, and coverage on every change (FR-DEV-01, FR-DEV-03).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege (NFR-SEC-02): this workflow only needs to read the code.
permissions:
  contents: read

# If a pull request gets a new push, cancel the older run instead of running both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (pinned; see global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"

      - name: Restore packages
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            "-reporttypes:MarkdownSummaryGithub;JsonSummary"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        
      - name: Enforce coverage minimum (NFR-MNT-01)
        run: |
          coverage=$(jq '.summary.linecoverage' coverage/Summary.json)
          echo "Line coverage: ${coverage}% (minimum 80%)"
          awk -v c="$coverage" 'BEGIN { exit !(c >= 80) }' || {
            echo "::error::Line coverage ${coverage}% is below the 80% minimum (NFR-MNT-01)."
            exit 1
          }