# Continuous integration: secret scan, build, format checks, tests, dependency audits, and coverage
# on every change (FR-DEV-01, FR-DEV-03, NFR-SEC-04, NFR-MNT-04).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege (NFR-SEC-02): this workflow only needs to read the code.
permissions:
  contents: read

# If a pull request gets a new push, cancel the older run instead of running both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails if any tracked file looks like it contains a secret (FR-DEV-01, NFR-SEC-01). Only file
      # names, line numbers, and the kind of secret are printed, never the value.
      # package-lock.json is skipped: its integrity hashes look like secrets but are public checksums.
      - name: Scan for secrets
        run: |
          python3 -m venv "$RUNNER_TEMP/secret-scan"
          "$RUNNER_TEMP/secret-scan/bin/pip" install --quiet --disable-pip-version-check detect-secrets==1.5.0
          "$RUNNER_TEMP/secret-scan/bin/detect-secrets" scan \
            --exclude-files '(^|/)package-lock\.json$|\.(pdf|png|jpg|svg)$' > "$RUNNER_TEMP/secrets.json"
          if jq -e '.results == {}' "$RUNNER_TEMP/secrets.json" > /dev/null; then
            echo "No secrets found."
          else
            jq -r '.results | to_entries[] | .key as $file | .value[] | "::error file=\($file),line=\(.line_number)::Possible secret: \(.type)"' "$RUNNER_TEMP/secrets.json"
            exit 1
          fi

      - name: Set up .NET (pinned; see global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"

      - name: Restore packages
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The config file is checked on its own first, so a bad config change fails a clearly
      # named step (FR-CFG-02). The full test run below includes these tests again.
      - name: Validate config (FR-CFG-02)
        run: >
          dotnet test tests/FeedbackIntel.Core.Tests --no-build --configuration Release
          --filter "FullyQualifiedName~ConfigFileTests"

      - name: Test with coverage
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # Runs even if a test failed, but only when coverage data exists. Otherwise an earlier
      # failure would also show up here as a confusing "no report files" error.
      - name: Coverage summary
        if: always() && hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            "-reporttypes:MarkdownSummaryGithub;JsonSummary"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage minimum (NFR-MNT-01)
        run: |
          coverage=$(jq '.summary.linecoverage' coverage/Summary.json)
          echo "Line coverage: ${coverage}% (minimum 80%)"
          awk -v c="$coverage" 'BEGIN { exit !(c >= 80) }' || {
            echo "::error::Line coverage ${coverage}% is below the 80% minimum (NFR-MNT-01)."
            exit 1
          }

  # The dashboard's tests run its real queries in DuckDB, and the build proves every pinned
  # library, including DuckDB's Parquet extension, can still be downloaded and assembled.
  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install pinned libraries
        run: npm ci

      # Fails on any known high or critical vulnerability in the dashboard's packages (NFR-SEC-04).
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check formatting (NFR-MNT-04)
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build the site
        run: npm run build -- "$RUNNER_TEMP/site"
